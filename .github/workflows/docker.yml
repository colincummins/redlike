name: Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Server smoke test
        run: ./scripts/docker-smoke-test.sh